name: AI image generation (pollinations+pixelster)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      NSHARDS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - name: Generate missing item images (shard ${{ matrix.shard }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u scripts/ai_gen.py
