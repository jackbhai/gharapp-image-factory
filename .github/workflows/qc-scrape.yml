name: Blinkit image scrape
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scrape Blinkit images -> food-images branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SEED_PATH: docs/gharapp_seed.json
        run: python scripts/qc_scrape.py
      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinkit_map
          path: scraped/blinkit_map.json
          if-no-files-found: ignore
